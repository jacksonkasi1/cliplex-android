name: Apply production source fixes

on:
  push:
    branches: [agent/taste-skill-ui-v2]
    paths:
      - .github/workflows/apply-production-source-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/taste-skill-ui-v2
          fetch-depth: 0

      - name: Apply API guards and exact three-minute capture constant
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          engine = Path("app/src/main/java/com/jacksonkasi/cliplex/speech/AndroidSpeechRecognizerEngine.kt")
          replace_once(
              engine,
              "\toverride suspend fun transcribe(audio: AudioInput, language: LearningLanguage): TranscriptionResult =\n\t\toperationMutex.withLock {\n\t\t\tval availability = isAvailableWithoutMutex(language)",
              "\toverride suspend fun transcribe(audio: AudioInput, language: LearningLanguage): TranscriptionResult =\n\t\toperationMutex.withLock {\n\t\t\tif (Build.VERSION.SDK_INT < Build.VERSION_CODES.TIRAMISU) {\n\t\t\t\tthrow SpeechEngineException(\n\t\t\t\t\tSpeechFallbackReason.API_LEVEL_UNSUPPORTED,\n\t\t\t\t\t\"Android on-device recognition requires Android 13 or newer\",\n\t\t\t\t)\n\t\t\t}\n\t\t\tval availability = isAvailableWithoutMutex(language)",
          )
          replace_once(
              engine,
              "\tprivate fun confidence(level: Int): Float? = when (level) {",
              "\t@RequiresApi(Build.VERSION_CODES.UPSIDE_DOWN_CAKE)\n\tprivate fun confidence(level: Int): Float? = when (level) {",
          )
          replace_once(
              engine,
              "\tprivate fun RecognitionSupport.resolveLanguage(requestedTag: String): ResolvedLanguage {",
              "\t@RequiresApi(Build.VERSION_CODES.TIRAMISU)\n\tprivate fun RecognitionSupport.resolveLanguage(requestedTag: String): ResolvedLanguage {",
          )
          replace_once(
              engine,
              "\tprivate fun Int.toSpeechException(): SpeechEngineException = when (this) {",
              "\t@RequiresApi(Build.VERSION_CODES.S)\n\tprivate fun Int.toSpeechException(): SpeechEngineException = when (this) {",
          )

          capture = Path("app/src/main/java/com/jacksonkasi/cliplex/service/CaptureService.kt")
          replace_once(
              capture,
              "\t\tconst val MAX_CAPTURE_DURATION_SECONDS = 180\n\t\tprivate const val MAX_CAPTURE_SAMPLES = SAMPLE_RATE_HZ * MAX_CAPTURE_DURATION_SECONDS",
              "\t\tconst val MAX_CAPTURE_SECONDS = 180\n\t\tprivate const val MAX_CAPTURE_SAMPLES =\n\t\t\tSAMPLE_RATE_HZ * MAX_CAPTURE_SECONDS",
          )

          test = Path("app/src/test/java/com/jacksonkasi/cliplex/service/CaptureServiceDurationTest.kt")
          text = test.read_text(encoding="utf-8")
          if text.count("MAX_CAPTURE_DURATION_SECONDS") != 2:
              raise SystemExit("Unexpected capture-duration test structure")
          test.write_text(text.replace("MAX_CAPTURE_DURATION_SECONDS", "MAX_CAPTURE_SECONDS"), encoding="utf-8")

          Path(".github/workflows/apply-production-source-fixes.yml").unlink()
          PY

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Android API guards and capture limit"
          git push origin HEAD:agent/taste-skill-ui-v2
