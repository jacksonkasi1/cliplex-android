name: Android UI check

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/duolingo-inspired-ui-refactor]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: generic
            kleidiai: false
            artifact: cliplex-generic-safe-debug
            apk: cliplex-generic-safe-debug.apk
          - configuration: kleidiai-experimental
            kleidiai: true
            artifact: cliplex-kleidiai-experimental-safe-debug
            apk: cliplex-kleidiai-experimental-safe-debug.apk

    steps:
      - name: Check out source and whisper.cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Test, lint and assemble ${{ matrix.configuration }} safe debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testSafeDebugUnitTest \
            :app:lintSafeDebug \
            :app:assembleSafeDebug \
            :app:assembleSafeDebugAndroidTest \
            -PcliplexKleidiAi=${{ matrix.kleidiai }}

      - name: Stage installable APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/safe/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/${{ matrix.apk }}"
          sha256sum "dist/${{ matrix.apk }}" > "dist/${{ matrix.apk }}.sha256"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/${{ matrix.apk }}"
          unzip -l "dist/${{ matrix.apk }}" | grep -q 'assets/licenses/kleidiai-NOTICE.txt'

      - name: Upload safe debug APK, checksum and benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.apk }}
            dist/${{ matrix.apk }}.sha256
            benchmarks/ARM_KERNEL_COMPARISON.md
            benchmarks/raw/**
            benchmarks/derived/**
          if-no-files-found: error
          retention-days: 14
