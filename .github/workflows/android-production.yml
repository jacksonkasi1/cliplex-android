name: Android production build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: v1.0.0
  RELEASE_APK_NAME: ClipLex-v1.0.0-arm64.apk
  MAX_APK_BYTES: '60000000'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source and whisper.cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android toolchain
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Test, lint and assemble submission APK
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:testSafeSubmissionUnitTest \
            :app:lintSafeSubmission \
            :app:assembleSafeSubmission
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "Production validation failed. Printing complete lint text reports when available."
            find app/build -type f -name 'lint-results-safeSubmission.txt' -print -exec cat {} \; || true
          fi

          exit "$STATUS"

      - name: Verify and stage production artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/safe/submission -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          mkdir -p dist
          cp "$APK" "dist/$RELEASE_APK_NAME"
          sha256sum "dist/$RELEASE_APK_NAME" > "dist/$RELEASE_APK_NAME.sha256"

          APK_BYTES="$(stat -c '%s' "dist/$RELEASE_APK_NAME")"
          if [ "$APK_BYTES" -gt "$MAX_APK_BYTES" ]; then
            echo "APK is ${APK_BYTES} bytes; limit is ${MAX_APK_BYTES}." >&2
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "dist/$RELEASE_APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/$RELEASE_APK_NAME"

          DEBUGGABLE="$(apkanalyzer manifest debuggable "dist/$RELEASE_APK_NAME" | tr -d '\r')"
          if [ "$DEBUGGABLE" != "false" ]; then
            echo "Submission APK must not be debuggable; apkanalyzer returned: $DEBUGGABLE" >&2
            exit 1
          fi

          cat > dist/build-metadata.txt <<META
          version=1.0.0
          variant=safeSubmission
          abi=arm64-v8a
          debuggable=false
          minified=true
          resource_shrinking=true
          max_capture_seconds=180
          apk_bytes=$APK_BYTES
          git_sha=$GITHUB_SHA
          META

          MAPPING="app/build/outputs/mapping/safeSubmission/mapping.txt"
          if [ -f "$MAPPING" ]; then
            cp "$MAPPING" dist/mapping.txt
          fi

          LINT_HTML="app/build/reports/lint-results-safeSubmission.html"
          if [ -f "$LINT_HTML" ]; then
            cp "$LINT_HTML" dist/lint-results.html
          fi

      - name: Upload submission build
        uses: actions/upload-artifact@v4
        with:
          name: ClipLex-v1.0.0-production
          path: dist/**
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: ClipLex-v1.0.0-production
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/$RELEASE_APK_NAME" \
              "dist/$RELEASE_APK_NAME.sha256" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/$RELEASE_APK_NAME" \
              "dist/$RELEASE_APK_NAME.sha256" \
              --target "$GITHUB_SHA" \
              --title "ClipLex v1.0.0" \
              --notes-file docs/RELEASE_NOTES_V1.0.0.md
          fi
